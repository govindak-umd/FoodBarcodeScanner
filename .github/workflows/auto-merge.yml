name: Auto Merge (after CI + isort)

on:
  # Fire only when THESE workflows finish
  workflow_run:
    workflows:
      - python ci check        # <-- must match the "name:" at top of ci.yml
      - isort check            # <-- must match the "name:" at top of isort.yml
    types:
      - completed

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  enable:
    # Only run when the triggering workflow completed successfully
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # 1) Resolve the PR for this workflow_run
      - name: Resolve PR from workflow_run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;

            // Try to get the PR number from the event payload directly
            let prNumber = wr.pull_requests?.[0]?.number || null;

            // Fallback: find an open PR by the head SHA
            if (!prNumber) {
              const { owner, repo } = context.repo;
              const sha = wr.head_sha;
              const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open' });
              const match = prs.find(p => p.head && p.head.sha === sha);
              if (match) prNumber = match.number;
            }

            if (!prNumber) core.setFailed('Could not resolve PR for this workflow_run.');
            core.setOutput('number', prNumber);

      # 2) Short wait to let all statuses settle, then verify BOTH required contexts are green
      - name: Verify required checks (GraphQL rollup)
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED = [
              'isort check / isort-fix (pull_request)',
              'python ci check / test (pull_request)',
            ];
            const { owner, repo } = context.repo;
            const number = Number('${{ steps.pr.outputs.number }}');

            // brief delay
            await new Promise(r => setTimeout(r, 15000));

            const q = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    isDraft
                    reviewDecision
                    mergeStateStatus
                    commits(last:1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            state
                            contexts(first:100) {
                              nodes {
                                __typename
                                ... on CheckRun     { name conclusion }
                                ... on StatusContext{ context state }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;
            const data = await github.graphql(q, { owner, repo, number });
            const pr = data.repository.pullRequest;

            const rollup = pr.commits.nodes[0]?.commit?.statusCheckRollup || null;
            if (!rollup) core.setFailed('No statusCheckRollup yet (checks not reported).');

            const seen = {};
            for (const n of (rollup?.contexts?.nodes || [])) {
              if (n.__typename === 'CheckRun') seen[n.name] = (n.conclusion || '').toLowerCase();
              if (n.__typename === 'StatusContext') seen[n.context] = (n.state || '').toLowerCase();
            }

            console.log('Overall:', rollup?.state);
            console.log('mergeStateStatus:', pr.mergeStateStatus);
            console.log('reviewDecision:', pr.reviewDecision);
            console.log('isDraft:', pr.isDraft);
            console.log('Seen contexts:', seen);

            const missing = [];
            const failed = [];
            for (const req of REQUIRED) {
              if (!(req in seen)) { missing.push(req); continue; }
              if (seen[req] !== 'success') failed.push(`${req} => ${seen[req]}`);
            }

            if (missing.length) core.setFailed('Missing: ' + missing.join(', '));
            if (failed.length)  core.setFailed('Non-success: ' + failed.join('; '));

            if (!missing.length && !failed.length) core.setOutput('ok', 'true');

      # 3) Add the label (optional) so humans see intent
      - name: Add `automerge` label if missing
        if: steps.verify.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number('${{ steps.pr.outputs.number }}');
            const pr = await github.rest.issues.get({ owner, repo, issue_number: number });
            const labels = pr.data.labels.map(l => l.name);
            if (!labels.includes('automerge')) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['automerge'] });
              console.log('Added label: automerge');
            } else {
              console.log('Label already present');
            }

      # 4) Enable native auto-merge for the PR
      - name: Enable GitHub Auto-Merge (squash)
        if: steps.verify.outputs.ok == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.pr.outputs.number }}
          merge-method: squash
