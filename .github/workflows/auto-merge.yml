name: Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      # Resolve the PR for both event types (PR + check_suite)
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.pull_request;
            if (!pr && context.eventName === 'check_suite') {
              const prs = context.payload.check_suite.pull_requests || [];
              if (prs.length) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prs[0].number
                });
                pr = data;
              }
            }
            if (!pr) core.setFailed('No PR found for this event.');
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('labels', JSON.stringify(pr.labels.map(l => l.name)));

      # Verify your required checks (treats both Checks + Status contexts)
      - name: Verify required checks
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED = [
              { job: 'isort-fix', status: 'isort_check / isort-fix (pull_request)' },
              { job: 'ci-test',      status: 'ci_check / test (pull_request)' },
            ];

            const { owner, repo } = context.repo;
            const sha = '${{ steps.pr.outputs.sha }}';

            // Checks API (job names)
            const checksResp = await github.rest.checks.listForRef({ owner, repo, ref: sha, status: 'completed' });
            const checkRuns = checksResp.data.check_runs || [];
            const checksByName = Object.fromEntries(checkRuns.map(c => [c.name, c.conclusion]));

            // Statuses API (UI contexts)
            const statusResp = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            const statuses = statusResp.data.statuses || [];
            const statusesByContext = Object.fromEntries(statuses.map(s => [s.context, s.state])); // success|failure|pending

            console.log('--- Check Runs ---'); console.log(checksByName);
            console.log('--- Status Contexts ---'); console.log(statusesByContext);

            function ok(nameJob, nameCtx) {
              const jobOk = nameJob in checksByName ? checksByName[nameJob] === 'success' : null;
              const ctxOk = nameCtx in statusesByContext ? statusesByContext[nameCtx] === 'success' : null;
              return jobOk === true || ctxOk === true ? true : (jobOk === null && ctxOk === null ? null : false);
            }

            const missing = [], failed = [];
            for (const req of REQUIRED) {
              const res = ok(req.job, req.status);
              if (res === null) missing.push(`${req.job} / ${req.status}`);
              else if (res === false) failed.push(`${req.job} / ${req.status}`);
            }

            core.setOutput('missing', missing.join(', '));
            core.setOutput('failed', failed.join(', '));

            if (missing.length || failed.length) {
              core.setOutput('ready', 'false');
              console.log('Not ready. Missing:', missing, 'Failed:', failed);
            } else {
              core.setOutput('ready', 'true');
              console.log('✅ All required checks passed.');
            }

      # Add the label automatically if all checks passed and it’s not already there
      - name: Add `automerge` label when ready
        if: steps.verify.outputs.ready == 'true' && !contains(steps.pr.outputs.labels, '"automerge"')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              labels: ['automerge']
            });
            console.log('Label `automerge` added.');

      # Enable native auto-merge (GitHub will merge once all requirements are satisfied)
      - name: Enable GitHub Auto-Merge (squash)
        if: steps.verify.outputs.ready == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
