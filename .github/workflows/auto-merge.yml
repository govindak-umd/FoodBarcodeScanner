name: PR Checks + Auto-fix + Wait & Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  autofix:
    name: Auto-fix (isort + Black) and push when labeled
    runs-on: ubuntu-latest
    # Only push if: 1) same-repo PR (not a fork) AND 2) PR has 'autofix' label
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(join(fromJson(toJson(github.event.pull_request.labels)).*.name, ','), 'autofix')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          pip install isort black

      - name: Run formatters (auto-fix)
        run: |
          isort .
          black .

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-apply black & isort"
            git push
          else
            echo "No changes to commit."
          fi

  checks:
    name: isort/Black (check-only) + pylint
    runs-on: ubuntu-latest
    needs: [autofix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install isort black pylint

      - name: isort (check-only)
        run: isort --check-only --diff .

      - name: Black (check-only)
        run: black --check --diff .

      - name: Pylint
        run: |
          # Adjust the discovery as needed (e.g., src/ pkg/)
          PY_FILES="$(git ls-files '*.py')"
          if [ -z "$PY_FILES" ]; then
            echo "No Python files found."
          else
            pylint $PY_FILES
          fi

  tests:
    name: pytest (if tests present)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run pytest
        if: ${{ hashFiles('**/tests/**') != '' }}
        run: pytest -q

      - name: No tests detected
        if: ${{ hashFiles('**/tests/**') == '' }}
        run: echo "No tests directory found; skipping pytest."

  wait_and_merge:
    name: Wait for checks & auto-merge (label-gated)
    runs-on: ubuntu-latest
    needs: [checks, tests]
    steps:
      - name: Require 'automerge' label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed('Not a PR context.'); return; }
            if (!pr.labels?.some(l => l.name === 'automerge')) {
              core.setFailed("PR is missing required 'automerge' label");
            }

      - name: Wait for rollup to be SUCCESS (poll)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # Polls the GraphQL statusCheckRollup on the head commit
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            async function rollup() {
              const q = `
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      commits(last:1) {
