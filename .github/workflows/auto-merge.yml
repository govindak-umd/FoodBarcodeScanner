name: Auto Merge

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR for this event
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.pull_request;
            if (!pr && context.eventName === 'check_suite') {
              const prs = context.payload.check_suite.pull_requests || [];
              if (prs.length) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prs[0].number
                });
                pr = data;
              }
            }
            if (!pr) core.setFailed('No PR found for this event.');
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('labels', JSON.stringify(pr.labels.map(l => l.name)));

      - name: Require `automerge` label
        run: |
          echo "Labels: ${{ steps.pr.outputs.labels }}"
          echo "${{ steps.pr.outputs.labels }}" | grep -q '"automerge"' || {
            echo "No 'automerge' label — skipping."; exit 78;
          }

      - name: Verify required checks (jobs or status contexts)
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED = [
              { job: 'test',      status: 'python ci check / test (pull_request)' },
              { job: 'isort-fix', status: 'isort check / isort-fix (pull_request)' },
            ];

            const { owner, repo } = context.repo;
            const sha = '${{ steps.pr.outputs.sha }}';

            // Checks API (job names)
            const checksResp = await github.rest.checks.listForRef({ owner, repo, ref: sha, status: 'completed' });
            const checkRuns = checksResp.data.check_runs || [];
            const checksByName = Object.fromEntries(checkRuns.map(c => [c.name, c.conclusion]));

            // Statuses API (contexts as shown in PR UI)
            const statusResp = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            const statuses = statusResp.data.statuses || [];
            const statusesByContext = Object.fromEntries(statuses.map(s => [s.context, s.state])); // success|failure|pending

            console.log('--- Check Runs (name -> conclusion) ---');
            for (const [k,v] of Object.entries(checksByName)) console.log(`${k} -> ${v}`);
            console.log('--- Status Contexts (context -> state) ---');
            for (const [k,v] of Object.entries(statusesByContext)) console.log(`${k} -> ${v}`);

            const missing = [];
            const failed  = [];

            for (const req of REQUIRED) {
              const jobPass    = req.job    in checksByName   ? checksByName[req.job] === 'success'   : null;
              const statusPass = req.status in statusesByContext ? statusesByContext[req.status] === 'success' : null;

              if (jobPass === true || statusPass === true) continue;      // passed via either API
              if (jobPass === null && statusPass === null) { missing.push(`${req.job} / ${req.status}`); continue; }
              failed.push(`${req.job} / ${req.status}`);
            }

            if (missing.length) core.setFailed(`Missing checks: ${missing.join(', ')}`);
            if (failed.length)  core.setFailed(`Failed checks: ${failed.join(', ')}`);
            if (!missing.length && !failed.length) console.log('✅ All required checks passed.');

      - name: Enable GitHub Auto-Merge (squash)
        if: success()
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
