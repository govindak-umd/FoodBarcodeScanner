name: Auto Merge (after CI + isort)

on:
  workflow_run:
    workflows:
      - 'python ci check' # <-- must match the "name:" at top of ci.yml
      - 'isort check'     # <-- must match the "name:" at top of isort.yml
    types:
      - completed
    branches:
      - main
      - master # Adjust to your protected branch(es)
      - 'releases/**'

permissions:
  pull-requests: write
  contents: write
  statuses: read

jobs:
  automerge:
    name: Auto Merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR from workflow_run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;

            // Find an open PR by the head SHA
            const { owner, repo } = context.repo;
            const sha = wr.head_sha;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open' });
            const match = prs.find(p => p.head && p.head.sha === sha);
            
            if (!match) {
              core.setFailed(`Could not resolve PR for this workflow_run (head_sha: ${sha}).`);
            } else {
              core.setOutput('number', match.number);
            }

      - name: Enable auto-merge
        id: enable-automerge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.pr.outputs.number }}
          merge-method: squash
          # Optional: Add a label to indicate that auto-merge was enabled.
          # add-labels: 'automerge'
