name: PR Checks + Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

# Prevents multiple runs fighting each other on the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # your sort steps here

  black:
    runs-on: ubuntu-latest
    needs: [sort]
    steps:
      - uses: actions/checkout@v4
      # your black steps here

  lint:
    runs-on: ubuntu-latest
    needs: [black]
    steps:
      - uses: actions/checkout@v4
      # your pylint/flake8 steps here

  # (Optional) tests job if you have one
  tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      # your pytest steps here

  enable-automerge:
    # Only enable when the PR has the "automerge" label
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    # Make this wait for your checks. Include 'tests' if you use it.
    needs: [lint, tests]
    steps:
      - name: Enable PR auto-merge (GitHub native)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash   # or "merge" / "rebase"

  merge-when-green:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    needs: [enable-automerge]
    steps:
      - name: Merge when green (waits for *all* required checks)
        uses: peter-evans/merge-when-green@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          interval-seconds: 20
          retries: 120
