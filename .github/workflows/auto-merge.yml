name: PR Checks + Wait and Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isort
        run: pip install isort

      # On PRs: check only (fail if imports need sorting)
      - name: isort check (PR)
        if: github.event_name == 'pull_request'
        run: |
          isort --check-only --diff .

      # On pushes: auto-fix and (if needed) commit the changes
      - name: isort auto-fix & push (push)
        if: github.event_name == 'push'
        run: |
          isort .
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-apply isort"
            git push
          else
            echo "No import changes needed."
          fi


  lint:
    runs-on: ubuntu-latest
    needs: [sort]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install black pytest

      - name: Black (check only)
        run: |
          echo "Checking code formatting with Black..."
          black .

  wait_and_merge:
    runs-on: ubuntu-latest
    needs: [sort, black, lint, tests]   # <— only starts after all checks succeed
    steps:
      - name: Require 'automerge' label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed('Not a PR context.'); return; }
            if (!pr.labels?.some(l => l.name === 'automerge')) {
              core.setFailed("PR is missing required 'automerge' label");
            }

      - name: Wait for rollup to be SUCCESS (poll)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            async function rollup() {
              const q = `
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      commits(last:1) {
                        nodes {
                          commit {
                            oid
                            statusCheckRollup {
                              state
                              contexts(last:50) {
                                nodes {
                                  __typename
                                  ... on CheckRun { name status conclusion }
                                  ... on StatusContext { context state }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`;
              const res = await github.graphql(q, { owner, repo, number });
              const node = res?.repository?.pullRequest?.commits?.nodes?.[0]?.commit;
              return {
                sha: node?.oid,
                state: node?.statusCheckRollup?.state ?? "PENDING",
                contexts: node?.statusCheckRollup?.contexts?.nodes ?? []
              };
            }

            for (let i = 0; i < 60; i++) { // ~60 minutes @60s
              const { sha, state, contexts } = await rollup();
              core.info(`Head ${sha} rollup = ${state}`);
              contexts.slice(0, 10).forEach((c, i) => {
                if (c.__typename === "CheckRun") core.info(`  [${i}] ${c.name}: ${c.status}/${c.conclusion}`);
                else core.info(`  [${i}] ${c.context}: ${c.state}`);
              });
              if (state === "SUCCESS") return;
              if (state === "FAILURE") { core.setFailed("Some checks failed."); return; }
              await new Promise(r => setTimeout(r, 60000));
            }
            core.setFailed("Timed out waiting for checks to become SUCCESS.");

      - name: Merge (squash)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: "squash" });
              core.info(`PR #${number} merged 🎉`);
            } catch (e) {
              core.warning(`Direct merge failed (likely protections): ${e.message}`);
              core.exportVariable('NEED_FALLBACK', '1');

      - name: Fallback — enable native auto-merge
        if: env.NEED_FALLBACK == '1'
        run: |
          PR=${{ github.event.pull_request.number }}
          gh pr merge "$PR" --auto --squash --delete-branch
          echo "Enabled native auto-merge on PR #$PR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
