name: PR Checks + Wait and Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: isort & black (checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install isort black

      - name: isort (check only)
        run: isort --check-only --diff .

      - name: black (check only)
        run: black --check --diff .

  tests:
    name: pytest (if tests present)
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run pytest
        if: ${{ hashFiles('**/tests/**') != '' }}
        run: pytest -q

      - name: No tests detected
        if: ${{ hashFiles('**/tests/**') == '' }}
        run: echo "No tests directory found; skipping pytest."

  wait_and_merge:
    name: Wait for checks & merge (label-gated)
    runs-on: ubuntu-latest
    needs: [format, tests]   # only starts after checks/tests are done
    steps:
      - name: Require 'automerge' label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed('Not a PR context.'); return; }
            if (!pr.labels?.some(l => l.name === 'automerge')) {
              core.setFailed("PR is missing required 'automerge' label");
            }

      - name: Wait for rollup to be SUCCESS (poll)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            async function rollup() {
              const q = `
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      commits(last:1) {
                        nodes {
                          commit {
                            oid
                            statusCheckRollup {
                              state
                              contexts(last:50) {
                                nodes {
                                  __typename
                                  ... on CheckRun { name status conclusion }
                                  ... on StatusContext { context state }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`;
              const res = await github.graphql(q, { owner, repo, number });
              const node = res?.repository?.pullRequest?.commits?.nodes?.[0]?.commit;
              return {
                sha: node?.oid,
                state: node?.statusCheckRollup?.state ?? "PENDING",
                contexts: node?.statusCheckRollup?.contexts?.nodes ?? []
              };
            }

            for (let i = 0; i < 60; i++) { // ~60 minutes @60s
              const { sha, state, contexts } = await rollup();
              core.info(`Head ${sha} rollup = ${state}`);
              contexts.slice(0, 10).forEach((c, i) => {
                if (c.__typename === "CheckRun") core.info(`  [${i}] ${c.name}: ${c.status}/${c.conclusion}`);
                else core.info(`  [${i}] ${c.context}: ${c.state}`);
              });
              if (state === "SUCCESS") return;
              if (state === "FAILURE") { core.setFailed("Some checks failed."); return; }
              await new Promise(r => setTimeout(r, 60000));
            }
            core.setFailed("Timed out waiting for checks to become SUCCESS.");

      - name: Merge (squash)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: "squash" });
              core.info(`PR #${number} merged 🎉`);
            } catch (e) {
              core.warning(`Direct merge failed (likely protections): ${e.message}`);
              core.exportVariable('NEED_FALLBACK', '1');

      - name: Fallback — enable native auto-merge
        if: env.NEED_FALLBACK == '1'
        run: |
          PR=${{ github.event.pull_request.number }}
          gh pr merge "$PR" --auto --squash --delete-branch
          echo "Enabled native auto-merge on PR #$PR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
