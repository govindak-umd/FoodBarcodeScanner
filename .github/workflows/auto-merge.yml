name: Auto Merge

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  enable-auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto merge')
    runs-on: ubuntu-latest
    steps:
      - name: Check that CI and Sort checks passed
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['python ci check', 'isort check'];
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;

            const checks = await github.rest.checks.listForRef({
              owner, repo, ref: sha, status: 'completed'
            });

            const byName = Object.fromEntries(
              checks.data.check_runs.map(c => [c.name, c.conclusion])
            );

            const missing = required.filter(n => !(n in byName));
            const failed  = required.filter(n => byName[n] !== 'success');

            if (missing.length) core.setFailed(`Missing required checks: ${missing.join(', ')}`);
            if (failed.length)  core.setFailed(`Failed checks: ${failed.join(', ')}`);
            if (!missing.length && !failed.length) {
              console.log('✅ All required checks passed.');
            }

      - name: Enable GitHub Auto-Merge (Squash)
        if: success()
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
