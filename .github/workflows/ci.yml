name: ci_check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]


permissions:
  contents: write
  pull-requests: write

jobs:
  ci-test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .  # allows imports like `from main import dummy_test`

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo "Installing dependencies from requirements.txt"
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — installing minimal tools"
            pip install pytest pytest-cov
          fi
          # Always ensure tools for linting/formatting are present
          python -m pip install black pylint

      - name: Run Pylint
        run: |
          echo "Running pylint..."
          python -m pylint main.py src tests || true

      - name: Run Black formatting check
        run: |
          echo "Checking code formatting with Black..."
          black .
          python -m black --check --diff .

      - name: Run tests
        run: |
          mkdir -p reports
          echo "Running tests on tests/test_fns.py"
          pytest tests/test_fns.py \
            --junitxml=reports/junit.xml \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
