name: CI (Python)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Optional: manual runs with a test target override
  workflow_dispatch:
    inputs:
      test_target:
        description: "pytest target (e.g., tests/test_main.py::test_dummy_basic)"
        required: false
        default: "tests"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    env:
      PYTHONPATH: .  # so `from main import dummy_test` works with your structure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure test tooling is present (in case not listed in requirements.txt)
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          mkdir -p reports
          # Use dispatch input if provided, else default to tests/
          TARGET="${{ github.event.inputs.test_target || 'tests' }}"
          pytest "$TARGET" \
            --junitxml=reports/junit.xml \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload reports (JUnit & coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn

      # Optional: add a short test summary to the job page
      - name: Job summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- JUnit report: attached as artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage XML: attached as artifact" >> $GITHUB_STEP_SUMMARY
