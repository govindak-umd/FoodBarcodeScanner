name: black format

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  black-check:
    name: Run Black (code formatting check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black

      - name: Run Black check and save report
        run: |
          mkdir -p reports
          black --check . > reports/black_report.txt || true