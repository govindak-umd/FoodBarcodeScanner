name: isort check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write  # needed for auto-fix on push branch

jobs:
  isort-fix:
    name: isort-fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isort
        run: pip install isort

      # On PRs: check only (fail if imports need sorting)
      - name: isort check (PR)
        if: github.event_name == 'pull_request'
        run: |
          isort --check-only --diff .

      # On pushes: auto-fix and (if needed) commit the changes
      - name: isort auto-fix & push (push)
        if: github.event_name == 'push'
        run: |
          isort .
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-apply isort"
            git push
          else
            echo "No import changes needed."
          fi
