name: Auto Merge

on:
  workflow_run:
    # IMPORTANT: these must match the *name:* at the top of each workflow
    workflows: ["Python CI", "isort Check", "Auto Format with Black]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || 'no-branch' }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}   # only PR-triggered runs
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });
            const pr = prs.find(p => p.state === 'open');
            if (!pr) { core.setOutput('skip', 'true'); return; }
            core.setOutput('skip', 'false');
            core.setOutput('pr_number', pr.number);

      - name: Exit if no open PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "No open PR for this SHA"; exit 0

      - name: Require auto-merge label and not a draft
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr_number
            });
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr_number
            });
            const hasLabel = labels.some(l => l.name === 'auto-merge');
            if (!hasLabel) core.setFailed("Missing 'auto-merge' label");
            if (pr.draft)  core.setFailed("PR is a draft");
            core.setOutput('base_ref', pr.base.ref);

      - name: Merge when mergeable_state becomes clean (with debug)
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");

            async function getPR() {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr_number
              });
              return data;
            }

            let pr = await getPR();
            let tries = 18; // ~90s
            while (tries-- && (pr.mergeable_state === 'unknown' || pr.mergeable_state === 'blocked')) {
              core.info(`Waiting… mergeable_state=${pr.mergeable_state}`);
              await new Promise(r => setTimeout(r, 5000));
              pr = await getPR();
            }

            core.info(`Final mergeable_state=${pr.mergeable_state}; draft=${pr.draft}; behind? ${pr.mergeable_state==='behind'}`);

            if (pr.mergeable_state === 'clean' && !pr.merged) {
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr_number, merge_method: 'squash'
              });
              core.info(`Auto-merged PR #${pr_number}`);
            } else {
              core.info(`Not mergeable. State=${pr.mergeable_state}. If 'behind', branch protection requires 'update branch'. If 'blocked', reviews or required checks not satisfied.`);
            }
