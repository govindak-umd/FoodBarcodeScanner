name: Auto Merge (after all checks)

on:
  workflow_run:
    workflows: ["Python CI", "isort Check", "Auto Format with Black"]   # must match the `name:` fields above
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });
            const pr = prs.find(p => p.state === 'open');
            if (!pr) { core.setOutput('skip', 'true'); return; }
            core.setOutput('skip', 'false');
            core.setOutput('pr_number', pr.number);
            core.setOutput('head_sha', sha);

      - name: Exit if no open PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "No open PR for this SHA"; exit 0

      - name: Require auto-merge label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number
            });
            const has = labels.some(l => l.name === 'auto-merge');
            core.setOutput('has_label', has);

      - name: Exit if label missing
        if: steps.label.outputs.has_label != 'true'
        run: echo "No auto-merge label; skipping."; exit 0

      - name: Merge when mergeable_state becomes clean (retry)
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");

            async function getPR() {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number
              });
              return data;
            }

            // poll up to ~60s while GitHub calculates mergeability or waits on reviews
            let pr = await getPR();
            let tries = 12;
            while (tries-- && (pr.mergeable_state === 'unknown' || pr.mergeable_state === 'blocked')) {
              await new Promise(r => setTimeout(r, 5000));
              pr = await getPR();
            }

            if (pr.draft) {
              core.info(`⏭️ PR #${pr_number} is a draft; not merging.`);
              return;
            }

            if (pr.mergeable_state === 'clean' && !pr.merged) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                merge_method: 'squash'
              });
              core.info(`Auto-merged PR #${pr_number}`);
            } else {
              core.info(`Not mergeable (state=${pr.mergeable_state}). Ensure required checks & reviews are satisfied.`);
            }

