name: Auto Merge PRs

on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check if PR has auto-merge label
        id: check_label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const hasAutoMerge = labels.data.some(label => label.name === 'auto merge');
            core.setOutput('auto_merge', hasAutoMerge);

      - name: Merge PR if all checks passed
        if: steps.check_label.outputs.auto_merge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.mergeable_state === 'clean') {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log(`Auto-merged PR #${pr.number}`);
            } else {
              console.log(`PR #${pr.number} not mergeable yet.`);
            }
