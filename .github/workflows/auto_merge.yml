name: Auto Merge (after all checks)

on:
  workflow_run:
    workflows: ["Python CI", "isort Check", "Auto Format with Black"]   # must match the `name:` fields above
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });
            const pr = prs.find(p => p.state === 'open');
            if (!pr) { core.setOutput('skip', 'true'); return; }
            core.setOutput('skip', 'false');
            core.setOutput('pr_number', pr.number);
            core.setOutput('head_sha', sha);

      - name: Exit if no open PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "No open PR for this SHA"; exit 0

      - name: Require auto-merge label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number
            });
            const has = labels.some(l => l.name === 'auto-merge');
            core.setOutput('has_label', has);

      - name: Exit if label missing
        if: steps.label.outputs.has_label != 'true'
        run: echo "No auto-merge label; skipping."; exit 0

      # Optional: sanity-check all check runs on the commit are successful/neutral/skipped
      - name: Verify all checks on commit are green
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const ref = "${{ steps.pr.outputs.head_sha }}";
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref
            });
            const allGreen = data.check_runs.every(cr =>
              ['success','neutral','skipped'].includes(cr.conclusion || '')
            );
            core.setOutput('all_green', allGreen);

      - name: Merge if mergeable per Branch Protection (state=clean)
        if: steps.checks.outputs.all_green == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number("${{ steps.pr.outputs.pr_number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            // 'clean' => all required checks + required reviews satisfied
            if (pr.mergeable_state === 'clean' && !pr.merged) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                merge_method: 'squash'
              });
              core.info(`✅ Auto-merged PR #${pr_number}`);
            } else {
              core.info(`⏭️ Not mergeable yet (state=${pr.mergeable_state}).`);
            }
